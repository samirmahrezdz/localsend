name: Build Personal (Windows & Android)

on:
  workflow_dispatch:
  push:
    branches:
      - quick-send-enhancements

env:
  FLUTTER_VERSION: "3.47.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit - rust_builder)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Generate code and i18n
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Analyze (app)
        working-directory: app
        run: |
          set +e
          flutter analyze > /tmp/analyze_app.log 2>&1
          rc=$?
          cat /tmp/analyze_app.log
          if [ "$rc" -ne 0 ]; then
            python3 -c "lines=[l.strip() for l in open('/tmp/analyze_app.log', encoding='utf-8', errors='replace') if l.strip()]; diags=[l for l in lines if (' • ' in l or 'error ' in l.lower() or 'warning ' in l.lower()) and not l.startswith(('Resolving','Downloading','Got dependencies','! '))]; out=(diags[:25] if diags else lines[-25:]); print('::error::Analyze(app) failed: ' + ' | '.join(out)[:3500])"
            exit "$rc"
          fi

      - name: Test (app)
        working-directory: app
        run: |
          set +e
          flutter test -r expanded > /tmp/test_app.log 2>&1
          rc=$?
          cat /tmp/test_app.log
          if [ "$rc" -ne 0 ]; then
            python3 -c "lines=[l.strip() for l in open('/tmp/test_app.log', encoding='utf-8', errors='replace') if l.strip()]; errs=[l for i,l in enumerate(lines) if any(k in l for k in ('[E]','Expected:','Actual:','EXCEPTION','Some tests failed','FAIL')) or (i>0 and '[E]' in lines[i-1])]; out=(errs[:25] if errs else lines[-20:]); print('::error::Test(app) failed: ' + ' | '.join(out)[:3500])"
            exit "$rc"
          fi

      - name: Dependencies (localsend_isolates)
        working-directory: packages/localsend_isolates
        run: flutter pub get

      - name: Analyze (localsend_isolates)
        working-directory: packages/localsend_isolates
        run: |
          set +e
          flutter analyze > /tmp/analyze_iso.log 2>&1
          rc=$?
          cat /tmp/analyze_iso.log
          if [ "$rc" -ne 0 ]; then
            python3 -c "lines=[l.strip() for l in open('/tmp/analyze_iso.log', encoding='utf-8', errors='replace') if l.strip()]; diags=[l for l in lines if (' • ' in l or 'error ' in l.lower() or 'warning ' in l.lower()) and not l.startswith(('Resolving','Downloading','Got dependencies','! '))]; out=(diags[:25] if diags else lines[-25:]); print('::error::Analyze(iso) failed: ' + ' | '.join(out)[:3500])"
            exit "$rc"
          fi

      - name: Test (localsend_isolates)
        working-directory: packages/localsend_isolates
        run: |
          set +e
          flutter test -r expanded > /tmp/test_iso.log 2>&1
          rc=$?
          cat /tmp/test_iso.log
          if [ "$rc" -ne 0 ]; then
            python3 -c "lines=[l.strip() for l in open('/tmp/test_iso.log', encoding='utf-8', errors='replace') if l.strip()]; errs=[l for i,l in enumerate(lines) if any(k in l for k in ('[E]','Expected:','Actual:','EXCEPTION','Some tests failed','FAIL')) or (i>0 and '[E]' in lines[i-1])]; out=(errs[:25] if errs else lines[-20:]); print('::error::Test(iso) failed: ' + ' | '.join(out)[:3500])"
            exit "$rc"
          fi

  build_windows:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Required by the CMake install step (app/windows/CMakeLists.txt installs localsend_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\localsend_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate code and i18n
        working-directory: app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows

      - name: Prepare Inno Setup payload
        run: |
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno" | Out-Null
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination "${{ runner.temp }}\inno" -Recurse
          Copy-Item -Path "app\assets\packaging\logo.ico" -Destination "${{ runner.temp }}\inno"
          Copy-Item -Path "support\build\windows\x64\*" -Destination "${{ runner.temp }}\inno" -Recurse
          New-Item -ItemType Directory -Force -Path "${{ runner.temp }}\inno-result" | Out-Null

      # SkipMsixHelper: the helper would be unsigned and Add-AppxPackage rejects unsigned packages
      - name: Compile installer (unsigned)
        run: iscc /DSkipSignTool /DSkipMsixHelper "/DPayloadDir=${{ runner.temp }}\inno" "/DResultDir=${{ runner.temp }}\inno-result" support\scripts\compile_windows_exe-inno.iss

      - name: Rename installer
        run: Rename-Item -Path "${{ runner.temp }}\inno-result\localsend.exe" -NewName "LocalSend-${{ needs.build.outputs.version }}-windows-x86-64-unsigned.exe"

      - name: Package portable zip
        working-directory: app
        run: |
          echo {} > build/windows/x64/runner/Release/settings.json
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/
          Remove-Item -ErrorAction SilentlyContinue build/windows/x64/runner/Release/localsend_msix_helper.msix
          Remove-Item -ErrorAction SilentlyContinue build/windows/x64/runner/Release/install_msix_helper.ps1
          Remove-Item -ErrorAction SilentlyContinue build/windows/x64/runner/Release/localsend_app.exe.manifest
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "LocalSend-${{ needs.build.outputs.version }}-windows-x86-64-portable.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x86-64-personal
          path: |
            ${{ runner.temp }}\inno-result\LocalSend-${{ needs.build.outputs.version }}-windows-x86-64-unsigned.exe
            app\LocalSend-${{ needs.build.outputs.version }}-windows-x86-64-portable.zip
          if-no-files-found: error

  build_android:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android signing (secret or ephemeral personal keystore)
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          KEY_PROPERTIES_B64: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          KEY_STORE_B64: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          if [ -n "$KEY_PROPERTIES_B64" ] && [ -n "$KEY_STORE_B64" ]; then
            echo "$KEY_PROPERTIES_B64" | base64 -di > app/android/key.properties
            mkdir -p secrets
            echo "$KEY_STORE_B64" | base64 -di > secrets/android-keystore.jks
          else
            keytool -genkeypair -v -keystore "${{ runner.temp }}/personal.jks" \
              -keyalg RSA -keysize 2048 -validity 10000 -alias personal \
              -storepass localsend -keypass localsend \
              -dname "CN=LocalSend Personal, OU=Personal, O=LocalSend, L=Local, S=Local, C=US"
            printf "storePassword=localsend\nkeyPassword=localsend\nkeyAlias=personal\nstoreFile=%s/personal.jks\n" "${{ runner.temp }}" > app/android/key.properties
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Generate code and i18n
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: |
          set +e
          flutter build apk --split-per-abi > /tmp/apk_build.log 2>&1
          rc=$?
          cat /tmp/apk_build.log
          if [ "$rc" -ne 0 ]; then
            python3 -c "import re; lines=[l.strip() for l in open('/tmp/apk_build.log', encoding='utf-8', errors='replace') if l.strip()]; errs=[l for l in lines if re.search(r'(error|exception|failed|cannot find symbol|could not)', l, re.I)]; pick=(errs[:15] + lines[-15:])[:25]; print('::error::Build APK failed: ' + ' | '.join(pick))"
            exit "$rc"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk-personal
          path: |
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.APK_BUILD_DIR }}/app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
